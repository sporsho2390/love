<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love U ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ffc8df, #f5aacb);
    font-family: Georgia, serif;
}

/* Floating hearts */
.heart {
    position: fixed;
    font-size: 42px;
    opacity: .55;
    animation: float 4s ease-in-out infinite;
    z-index: 1;
}

.h1 { top: 12%; left: 4%; }
.h2 { top: 5%; right: 4%; }
.h3 { top: 55%; left: 38%; }
.h4 { bottom: 17%; left: 5%; }
.h5 { bottom: 8%; right: 6%; }
.h6 { bottom: 2%; left: 43%; }

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-18px);
    }
}

/* Main Card */
.card {
    position: absolute;

    width: 90%;
    max-width: 650px;
    height: 700px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    border-radius: 45px;

    background: rgba(255, 220, 235, .70);

    backdrop-filter: blur(12px);

    box-shadow:
        0 20px 50px rgba(190,70,120,.25),
        inset 0 0 40px rgba(255,255,255,.35);

    text-align: center;

    padding-top: 75px;

    z-index: 2;
}

/* Cat + Heart */
.icons {
    font-size: 90px;
    margin-bottom: 70px;
}

/* Main Text */
.title {
    font-size: 48px;
    color: #351827;
    margin-bottom: 55px;
}

/* Buttons */
.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 45px;
}

button {
    border: none;
    border-radius: 40px;

    padding: 17px 45px;

    font-size: 21px;

    cursor: pointer;
}

/* Yes */
.yes {
    color: white;

    background: linear-gradient(
        135deg,
        #ff4f7d,
        #ff668b
    );

    box-shadow:
        0 8px 20px rgba(240,70,110,.3);
}

.yes:hover {
    transform: scale(1.06);
}

/* Disabled Yes */
.yes.disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

/* No */
.no {
    background: white;
    color: #777;

    box-shadow:
        0 8px 20px rgba(0,0,0,.08);

    position: relative;

    z-index: 20;

    transition:
        left .25s ease,
        top .25s ease;
}

/* Bottom text */
.subtitle {
    position: absolute;

    bottom: 75px;

    width: 100%;

    font-family: Arial, sans-serif;

    font-size: 20px;

    font-style: italic;

    color: #666;
}


/* Success Screen */
.success {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background: linear-gradient(
        135deg,
        #ffb6d4,
        #ff77aa
    );

    justify-content: center;
    align-items: center;

    text-align: center;
}


/* Success Box */
.success-box {
    width: 85%;
    max-width: 500px;

    padding: 45px 25px;

    border-radius: 35px;

    background: rgba(255,255,255,.88);

    box-shadow:
        0 20px 50px rgba(0,0,0,.15);
}


/* I love you too */
.success-box h1 {
    font-family: Georgia, serif;

    font-size: 38px;

    color: #e8396d;

    margin-bottom: 18px;
}


/* Text */
.success-box p {
    font-family: Arial, sans-serif;

    font-size: 21px;

    color: #555;
}


/* Back Button */
.back {
    margin-top: 28px;

    padding: 13px 35px;

    font-size: 18px;

    background: #ffffff;

    color: #e8396d;

    border: 2px solid #ff8caf;

    box-shadow: none;
}

.back:hover {
    transform: scale(1.05);
}


/* Mobile */
@media(max-width:600px) {

    .card {
        width: 90%;
        height: 700px;
    }

    .icons {
        font-size: 75px;
        margin-bottom: 70px;
    }

    .title {
        font-size: 38px;
        margin-bottom: 55px;
    }

    .buttons {
        gap: 25px;
    }

    button {
        padding: 16px 35px;
        font-size: 19px;
    }

    .subtitle {
        font-size: 17px;
    }

    .success-box h1 {
        font-size: 34px;
    }
}
</style>
</head>


<body>

<!-- Floating Hearts -->

<div class="heart h1">💗</div>
<div class="heart h2">💗</div>
<div class="heart h3">💗</div>
<div class="heart h4">💗</div>
<div class="heart h5">❤️</div>
<div class="heart h6">💗</div>


<!-- Main Interface -->

<div class="card">

    <div class="icons">
        🐱 ❤️
    </div>

    <h1 class="title">
        I love U ❤️
    </h1>


    <!-- Yes + No পাশাপাশি -->

    <div class="buttons">

        <button
            class="yes"
            id="yesBtn"
            onclick="yesClicked()">

            Yes 💖

        </button>


        <button
            class="no"
            id="noBtn"
            onclick="moveNo()">

            No 🙈

        </button>

    </div>


    <p class="subtitle">
        Some love stories don't allow “no” ✨
    </p>

</div>


<!-- Success Interface -->

<div
    class="success"
    id="success">

    <div class="success-box">

        <h1>
            I love you too ❤️
        </h1>

        <p>
            💕 Thank you! 💕
        </p>

        <div style="
            font-size:55px;
            margin-top:20px;
        ">
            🐱 ❤️ 🐱
        </div>


        <!-- Back Button -->

        <button
            class="back"
            onclick="goBack()">

            ↩️ Back

        </button>

    </div>

</div>


<script>

/* Answered state */
let answered = false;


/* YES */

function yesClicked() {

    if (answered) {
        return;
    }

    answered = true;

    /* Success screen */
    document
        .getElementById("success")
        .style.display = "flex";

}


/* NO */

function moveNo() {

    const btn =
        document.getElementById("noBtn");

    const width =
        btn.offsetWidth;

    const height =
        btn.offsetHeight;

    const maxX =
        window.innerWidth - width - 10;

    const maxY =
        window.innerHeight - height - 10;

    const x =
        Math.random() * maxX;

    const y =
        Math.random() * maxY;

    btn.style.position = "fixed";

    btn.style.left =
        x + "px";

    btn.style.top =
        y + "px";
}


/* BACK */

function goBack() {

    /* Success screen বন্ধ */
    document
        .getElementById("success")
        .style.display = "none";


    /* Yes permanently disabled */
  
    answered = false;
    

}

</script>

</body>
</html>
